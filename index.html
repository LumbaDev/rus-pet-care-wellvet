    <div id="root"></div>

    <script>
      (function () {
        function scrollToHash() {
          const hash = window.location.hash;
          if (hash === "#faq" || hash === "#como-funciona") {
            const element = document.getElementById(hash.substring(1));
            if (element) {
              // El 'auto' lo hace instantáneo, sin animación
              element.scrollIntoView({ behavior: "auto" });
              return true;
            }
          }
          return false;
        }

        // 1. Ejecución inmediata
        scrollToHash();

        // 2. Ejecución cuando el DOM está listo (por si el elemento no se había renderizado)
        document.addEventListener("DOMContentLoaded", scrollToHash);

        // 3. Observador: Útil si el contenido se genera dinámicamente (Vite/React/Vue)
        const observer = new MutationObserver((mutations, obs) => {
          if (scrollToHash()) {
            obs.disconnect(); // Una vez que lo encuentra y scrollea, se detiene
          }
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
